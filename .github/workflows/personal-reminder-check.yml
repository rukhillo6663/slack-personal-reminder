name: Personal Reminder Bot - Hourly Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: personal-reminder-bot
  cancel-in-progress: false

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install slack-sdk

      - name: Run personal reminder bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          YOUR_USER_ID: ${{ secrets.YOUR_USER_ID }}
        run: python personal-reminder-bot.py
