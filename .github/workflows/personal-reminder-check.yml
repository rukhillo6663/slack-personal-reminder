name: Personal Reminder Bot - Hourly Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: personal-reminder-bot
  cancel-in-progress: false

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Keeps sent_messages.json between runs so each mention is DM'd only once.
      # A new cache entry is saved at the end of every run; the next run restores
      # the most recent one.
      - name: Restore "already notified" memory
        uses: actions/cache@v4
        with:
          path: sent_messages.json
          key: sent-messages-${{ github.run_id }}
          restore-keys: |
            sent-messages-

      - name: Install dependencies
        run: pip install slack-sdk

      - name: Run personal reminder bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          YOUR_USER_ID: ${{ secrets.YOUR_USER_ID }}
        run: python personal-reminder-bot.py
