name: Personal Reminder Bot - Hourly Check

on:
  schedule:
    # GitHub Actions cron is in UTC. Dubai = UTC+4.
    # 10-19 UTC = 2:00 PM - 11:00 PM Dubai. Runs every 15 minutes (at :02, :17,
    # :32, :47) so that even when GitHub silently drops some scheduled runs,
    # at least one attempt per hour still lands. Extra runs are harmless: the
    # dedup state stops any repeat DM. Off :00 on purpose - the top of the hour
    # is GitHub's most congested, most-dropped slot.
    #
    # Every run in the 2 PM Dubai hour (10:xx UTC) is treated as the daily sweep
    # by the Python (hour == 14): it widens the window back to 11 PM last night.
    # The first one delivers the overnight mentions; the rest are dedup no-ops.
    - cron: '2,17,32,47 10-19 * * *'
  workflow_dispatch:

# Needed so the run can commit the dedup state file back to the repo.
permissions:
  contents: write

# Serialize runs so two of them can never race on the state-file commit/push
# (which could otherwise drop a state update and cause a duplicate DM). With
# 15-minute spacing and ~15s runtime they never actually overlap, but this
# guarantees it. cancel-in-progress: false = queue, don't cancel.
concurrency:
  group: personal-reminder-bot
  cancel-in-progress: false

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install slack-sdk

      - name: Run personal reminder bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          YOUR_USER_ID: ${{ secrets.YOUR_USER_ID }}
        run: python personal-reminder-bot.py

      - name: Persist dedup state
        if: always()
        run: |
          if [ -n "$(git status --porcelain .reminder-state)" ]; then
            git config user.name "reminder-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .reminder-state
            git commit -m "chore: update reminder dedup state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi

      - name: Log run time (debug)
        if: always()
        run: |
          echo "Ran at $(date -u +'%Y-%m-%d %H:%M:%S') UTC = $(TZ=Asia/Dubai date +'%Y-%m-%d %H:%M:%S') Dubai"
